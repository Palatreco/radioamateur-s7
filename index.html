<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deviens Radioamateur - Session 7</title>

<style>
:root{
--r:clamp(280px,60vw,500px);
--h:clamp(70px,12vw,110px);
--b:clamp(10px,5%,22px);
}
body{
font-family:Arial,sans-serif;
background:#0f172a;
color:#fff;
text-align:center;
margin:20px;
}
.container{
display:flex;
flex-wrap:wrap;
gap:20px;
justify-content:center;
align-items:flex-start;
}
.panel{
background:#1e293b;
padding:15px;
border-radius:12px;
max-width:320px;
text-align:left;
}
.resistance{
width:var(--r);
height:var(--h);
background:#D2B48C;
border-radius:999px;
position:relative;
margin:auto;
}
.band{
position:absolute;
width:var(--b);
height:100%;
border-left:1px solid rgba(0,0,0,.3);
border-right:1px solid rgba(0,0,0,.3);
}

#b1{left:18%}
#b2{left:30%}
#b3{left:42%}
#b4{left:58%}
#b5{left:75%}
button,input,select{
padding:10px;
margin:5px;
border-radius:8px;
}

select{
background:#1e293b;
color:white;
border:1px solid #475569;
}

button{
cursor:pointer;
}
.memo{
padding:5px;
margin:3px 0;
border-radius:4px;
font-weight:bold;
}
</style>
</head>

 <script>


</script>
<body>

<div style="
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
margin-bottom:10px;
">

<div style="text-align:left">

<h2 style="margin:0">
📻 Deviens Radioamateur - Session 7
</h2>

<p style="
margin:2px 0;
font-size:0.9rem;">
Codes couleurs des résistances
</p>

<p style="
font-size:0.8rem;
color:#94a3b8;
margin:0">
Application d'entraînement non officielle
</p>

</div>
</div>
<label>
<input type="checkbox" id="mode5"
onchange="nouvelle()">
📻 Mode 5 bandes
</label>

<div class="container">

<div>

<div class="resistance">

<div id="b1" class="band"></div>
<div id="b2" class="band"></div>
<div id="b3" class="band"></div>
<div id="b4" class="band"></div>
<div id="b5" class="band"></div>

</div>

<p id="question"></p>

<input
id="rep"
type="number"
placeholder="Exemple : 4700"
style="width:180px"
onkeydown="if(event.key==='Enter') verifier()">
<br>

<button onclick="verifier()">
✅ Vérifier
</button>
 <br>

<button onclick="nouvelle()">
🔄 Nouvelle
</button>
<button onclick="toggleAide()">
👁️ Aide
</button>

<br>

<select id="mode" onchange="changerMode()">

<option value="apprentissage">
📚 Mode Apprentissage
</option>

<option value="examen">
🎓 Mode Examen
</option>

</select>

<div id="message"></div>
<div id="score"></div>

</div>

<div class="panel" id="zoneAide">

<h3>📚 Aide mémoire</h3>

<div id="memo"></div>

<hr>

<h4>Multiplicateurs</h4>

<div>
×1 Noir<br>
×10 Marron<br>
×100 Rouge<br>
×1k Orange<br>
×10k Jaune<br>
×100k Vert<br>
×1M Bleu<br>
×10M Violet<br>
×100M Gris<br>
×1G Blanc<br>
×0.1 Or<br>
×0.01 Argent
</div>

<hr>

<label>
<input type="checkbox"
id="tolAdv"
onchange="majTol()">
Tolérances avancées
</label>

<div id="tol"></div>

</div>

</div>

<script>

const C=[
["Noir","black",0],
["Marron","#8B4513",1],
["Rouge","red",2],
["Orange","orange",3],
["Jaune","yellow",4],
["Vert","green",5],
["Bleu","blue",6],
["Violet","violet",7],
["Gris","gray",8],
["Blanc","white",9]
];

let valeur=0;
let bons=0;
let total=0;

function initialiser(){

    question.textContent =
        "Valeur de la résistance ?";

    memo.innerHTML = "";

    C.forEach(c => {

        memo.innerHTML +=
        `<div class="memo"
        style="background:${c[1]};
        color:${c[0]=="Jaune" || c[0]=="Blanc" || c[0]=="Orange" ? "black" : "white"}">

        ${c[0]} = ${c[2]}

        </div>`;

    });

    majTol();

}

function majTol(){

tol.innerHTML=
`
⭐ Or = ±5%<br>
⚪ Argent = ±10%<br>
🚫 Sans bande = ±20%
`;

if(tolAdv.checked){

tol.innerHTML+=`
<hr>
🟤 ±1%<br>
🔴 ±2%<br>
🟢 ±0.5%<br>
🔵 ±0.25%<br>
🟣 ±0.1%<br>
⚪ ±0.05%
`;
}
}

function nouvelle(){

const mode5=
document.getElementById("mode5").checked;

if(mode5){

let a=Math.floor(Math.random()*9)+1;
let b=Math.floor(Math.random()*10);
let c=Math.floor(Math.random()*10);
let m=Math.floor(Math.random()*7);

valeur=
(a*100+b*10+c)
*Math.pow(10,m);

b1.style.background=C[a][1];
b2.style.background=C[b][1];
b3.style.background=C[c][1];
b4.style.background=C[m][1];
b5.style.background="gold";

b3.style.display="block";

}else{

let a=Math.floor(Math.random()*9)+1;
let b=Math.floor(Math.random()*10);
let m=Math.floor(Math.random()*7);

valeur=
(a*10+b)
*Math.pow(10,m);

b1.style.background=C[a][1];
b2.style.background=C[b][1];

b3.style.display="none";

b4.style.background=C[m][1];
b5.style.background="gold";
}

rep.value="";
message.textContent="";
}

function format(v){

if(v>=1000000) return (v/1000000)+" MΩ";
if(v>=1000) return (v/1000)+" kΩ";

return v+" Ω";
}

function verifier(){

let r=parseInt(rep.value);

if(isNaN(r)) return;

total++;

if(r===valeur){

bons++;

message.style.color="lime";
message.textContent=
"✅ "+format(valeur);

}else{

message.style.color="#ff6b6b";
message.textContent=
"❌ "+format(valeur);
}

score.textContent =
"Score : " +
bons +
" / " +
total;
}
function changerMode(){

    const mode =
        document.getElementById("mode").value;

    const aide =
        document.getElementById("zoneAide");

    if(mode === "examen"){
        aide.style.display = "none";
    }
    else{
        aide.style.display = "block";
    }

    localStorage.setItem("mode",mode);

}

/*
const modeSauvegarde =
    localStorage.getItem("mode");

if(modeSauvegarde){
    document.getElementById("mode").value =
        modeSauvegarde;
}
*/
function toggleAide(){

    const aide =
        document.getElementById("zoneAide");

    if(aide.style.display === "none"){

        aide.style.display = "block";

    }else{

        aide.style.display = "none";

    }

}
console.log("Script lancé");
initialiser();
changerMode();
nouvelle();
</script>

</body>
</html>
